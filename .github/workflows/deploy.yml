name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  # The Worker is deployed by hand (`cd workers && npx wrangler deploy`) and
  # wrangler uses esbuild, which does not typecheck. Nothing was verifying it, so
  # 69 type errors accumulated unnoticed. Gate it here.
  typecheck-workers:
    runs-on: ubuntu-latest
    name: Typecheck & test Workers
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: workers/package-lock.json
      - name: Install dependencies
        working-directory: workers
        run: npm ci
      - name: tsc --noEmit
        working-directory: workers
        run: npx tsc --noEmit

      # Sun and moon letters are closed sets of 14, so "is this example in the
      # right class" is decidable — and the first grammar lesson shipped with
      # five separate factual errors of exactly that kind, including three
      # sun-letter examples that all began with moon letters. Anything decidable
      # belongs here rather than in a reviewer's patience.
      - name: Check authored content
        run: node scripts/check-content.mjs

      # seed-lessons.sql was hand-produced, so editing lessons.json changed the
      # file the content gate reads and left the file the database is seeded from
      # untouched — a green gate over content the app never serves, with no diff
      # to notice. Same failure shape as the Pages bindings.
      - name: Assert seed-lessons.sql matches lessons.json
        run: node scripts/gen-lessons-sql.mjs --check

      # check-content.mjs asks whether a lesson is true. This asks whether the
      # course can be walked, which had a worse answer: grammar-02's only exercise
      # was a `match`, which the grader excludes, so it scored 0, never completed,
      # and blocked grammar-04 → 08 → 10. Four of ten lessons were unreachable and
      # every individual lesson looked fine.
      - name: Check the learning path is walkable
        run: node scripts/check-pedagogy.mjs

      # globals.css and tailwind.config.ts are a palette and its mirror, and
      # nothing failed when they diverged. The hand-written "visual verification
      # page" ended up rendering 38 of its 39 colours from the pre-rebrand
      # palette — the one artifact whose job was to show the design system showed
      # the wrong one. This also catches a --font-* variable with no Tailwind
      # utility, which is how `font-naskh` compiled to nothing.
      - name: Assert the design tokens agree
        run: node scripts/gen-design-system.mjs --check

      # AGENTS.md is the file an agent reads first, and its API list has been wrong
      # once already — it named five endpoints that never existed and omitted a
      # dozen that did. Rewriting it by hand fixed that instance and left the hazard,
      # so four endpoints added later went undocumented. This also flags a page
      # nothing links to, which is how /dashboard went unreachable when the nav
      # shrank from eight items to six.
      - name: Assert AGENTS.md documents the live API and pages
        run: node scripts/gen-api-docs.mjs --check

      # Row types are generated from the migrations by applying them to an in-memory
      # SQLite database and reading pragma_table_info back. Twenty-four handlers used
      # to type their rows `Record<string, unknown>`, which is why four column names
      # in quran.ts were wrong with nothing objecting. With this committed and gated,
      # a migration that renames a column turns every handler still selecting the old
      # name into a compile error.
      - name: Assert the generated DB row types match the migrations
        run: node scripts/gen-db-types.mjs --check

      # "4,950 derived exercises" was written into five places by hand, so raising the
      # bank to 17,206 left every one of them lying. The manifest records what was
      # actually ingested and this holds the prose to it.
      - name: Assert the documented content counts match what shipped
        run: node scripts/gen-content-manifest.mjs --check

      # 60 generated root lessons. CI has no corpus — data/ and .wrangler/ are both
      # gitignored — so this checks what can be checked without one: structure, gradable
      # counts, answer indices in range, and the answer-position distribution, which is
      # the check that caught a broken shuffle putting 98% of answers at option 0. The
      # corpus comparison runs locally and reports that it was skipped here.
      - name: Assert the generated root lessons are sound
        run: node scripts/gen-root-lessons.mjs --check

      # 39 tests over grading, scoring, the SM-2 scheduler and the Quran ingest
      # alignment gate. Every case corresponds to a bug that shipped or a
      # behaviour previously checked only by hand. Adding them found a live one:
      # the scheduler could not advance past a one-day interval at quality 3.
      - name: Unit tests
        working-directory: workers
        run: npm test

  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    needs: typecheck-workers
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/app/package-lock.json

      - name: Install dependencies
        working-directory: src/app
        run: npm ci

      - name: Typecheck
        working-directory: src/app
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: src/app
        # NEXT_PUBLIC_* values are inlined at build time, so they must be present
        # here, not at runtime. NEXT_PUBLIC_API_URL is intentionally unset: the
        # API is served from the same origin by the _worker.js built below, so
        # requests are relative.
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        # NEXT_PUBLIC_API_TOKEN is deliberately NOT passed. NEXT_PUBLIC_* values
        # are inlined into the bundle, so supplying it published the shared token
        # to anyone who loaded the page — its own comment in src/app/lib/api.ts
        # admitted as much.
        #
        # Cloudflare Access replaced it: requests are authenticated at the edge
        # and the Worker reads identity from the signed assertion, ignoring the
        # Authorization header. The guard that used to fail the build when the
        # token was missing is gone because missing is now correct.
        run: npm run build

      # The token must not reappear in the bundle. NEXT_PUBLIC_* inlining makes
      # that a one-line mistake to reintroduce, and nothing else would notice.
      - name: Assert no API token was inlined into the bundle
        working-directory: src/app
        run: |
          if grep -rqE 'lb-[0-9a-f]{40}' out/ 2>/dev/null; then
            echo "::error::A bearer token was inlined into the build output."
            grep -rlE 'lb-[0-9a-f]{40}' out/ | head -5
            exit 1
          fi
          echo "no bearer token found in out/"

      # Pages advanced mode: a single _worker.js at the output root serves /api/*
      # through Hono and everything else from static assets, so the site and API
      # share one origin. Without this step the deployed site has no API at all.
      - name: Install worker dependencies
        working-directory: workers
        run: npm ci

      - name: Bundle API into the Pages output
        working-directory: workers
        run: |
          npm run build:pages
          test -s ../src/app/out/_worker.js || { echo "::error::_worker.js was not produced"; exit 1; }
          echo "_worker.js: $(wc -c < ../src/app/out/_worker.js) bytes"

      # The Pages project's D1/R2 bindings live in Cloudflare, not in this repo,
      # so removing one produces no diff and no build failure — it makes every
      # data route return 500 in production while /health still returns 200.
      # That exact state shipped on 2026-07-26. Assert it before deploying.
      - name: Assert Pages bindings match infra/pages-config.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/sync-pages-config.mjs --check

      # Lesson content ships with the code that renders it.
      #
      # Not via `wrangler d1 execute --file`: that uploads through the IMPORT api
      # (/d1/database/:id/import), which returns "Authentication error [code: 10000]" for
      # this token. I first read that as "the token cannot write to D1", said so, and
      # reverted the automation — an inference from one endpoint rather than a
      # measurement. Two probes then showed the same token reads AND writes D1 quite
      # happily through the QUERY api. Only the import path is closed, so seeding needs
      # the other endpoint and no permission change at all.
      #
      # Idempotent: every statement is INSERT OR REPLACE keyed on the lesson id. Runs
      # before the Pages deploy so content is in place when the code that reads it goes
      # live, and the script refuses to apply a partial seed.
      - name: Seed lesson content into D1
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # No CLOUDFLARE_ACCOUNT_ID: it does not match the account owning this database,
          # which is why the raw REST call returned 7403 while wrangler succeeded. The
          # script pins the owner.
          D1_DATABASE_ID: 6216c466-c244-4c16-8569-c7281585fbc6
        run: node scripts/seed-remote-d1.mjs scripts/seed-lessons.sql

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy src/app/out --project-name=languagebuilder-frontend --branch=main
