name = "languagebuilder"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# API_TOKEN is deliberately NOT declared here. A [vars] entry deploys as a
# plaintext environment variable and overwrites a same-named secret on every
# deploy, so keeping it here would silently defeat `wrangler secret put`.
#
# Set it once per environment instead:
#   npx wrangler secret put API_TOKEN
#
# Local dev reads it from workers/.dev.vars. The auth middleware fails closed
# (500) when it is missing rather than falling back to a published default.

[vars]
# Origins permitted to call /api/*. Only relevant for the standalone Worker;
# production is same-origin (see src/pages-entry.ts), so nothing needs CORS.
ALLOWED_ORIGINS = "https://languagebuilder-frontend.pages.dev,http://localhost:3000"

# Cloudflare Access identity. Set BOTH to switch from the shared bearer token to
# per-user identity — the middleware chooses by configuration, not by request
# header, so a caller cannot select the weaker mode. Set them on the *Pages*
# project (Settings -> Environment variables), since that is what serves the API.
#
#   ACCESS_TEAM_DOMAIN = "<your-team>.cloudflareaccess.com"
#   ACCESS_AUD         = "<the Access application's Audience tag>"
#
# The AUD tag matters: without it, a valid token for ANY Access application in
# any account would be accepted.

[[d1_databases]]
binding = "DB"
database_name = "languagebuilder"
database_id = "6216c466-c244-4c16-8569-c7281585fbc6"
# Applied in order with `wrangler d1 migrations apply languagebuilder`.
# 0001 is an idempotent baseline, so it is a no-op on the existing database.
migrations_dir = "src/db/migrations"

[[r2_buckets]]
bucket_name = "languagebuilder-assets"
binding = "languagebuilder_assets"
